<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-tl" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1e6f8f" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1e6f8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-tr" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#b66c3a" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#b66c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#f3ede1"/>
  <rect width="1200" height="630" fill="url(#bg-tl)"/>
  <rect width="1200" height="630" fill="url(#bg-tr)"/>

  <g transform="translate(80, 90)">
