  </g>

  <text x="80" y="240"
        font-family="'DM Serif Display', Georgia, serif"
        font-size="72" fill="#102a43">Old 70-Pint Dehumidifier</text>
  <text x="80" y="320"
        font-family="'DM Serif Display', Georgia, serif"
        font-size="72" fill="#102a43">Replacement Calculator</text>

  <text x="80" y="400"
